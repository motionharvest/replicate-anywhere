# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - replicateApiToken
    properties:
      replicateApiToken:
        type: string
        description: Replicate API token for authentication
      timeout:
        type: integer
        default: 300000
        description: Maximum time in milliseconds to wait for prediction completion
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        REPLICATE_API_TOKEN: config.replicateApiToken,
        MAX_POLL_TIME: (config.timeout || 300000).toString()
      }
    })
  exampleConfig:
    replicateApiToken: example-token-1234
    timeout: 300000
